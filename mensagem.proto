syntax = "proto3";
import "google/protobuf/timestamp.proto";

message ReqLogin {
    string usuario = 1;
    google.protobuf.Timestamp timestamp_req = 2;
}

message RepLogin {
    bool logado = 1;
    string sucesso = 2;
    string erro = 3;
    google.protobuf.Timestamp timestamp_rep = 4;
}

message ReqCriarCanal {
    string canal_nome = 1;
    google.protobuf.Timestamp timestamp_req = 2;
}

message RepCriarCanal {
    bool criado = 1;
    string sucesso = 2;
    string erro = 3;
    google.protobuf.Timestamp timestamp_rep = 4;
}

message ReqListarCanais {
    google.protobuf.Timestamp timestamp_req = 1;
}

message RepListarCanais {
    repeated string canais = 1;
    google.protobuf.Timestamp timestamp_rep = 2;
}

message ReqPublicar {
    string nome_canal = 1;
    string publicacao = 2;
    google.protobuf.Timestamp timestamp_req = 3;
}

message RepPublicar {
    bool publicado = 1;
    string sucesso = 2;
    string erro = 3;
    google.protobuf.Timestamp timestamp_rep = 4;
}

message EnviarPub {
    string topico = 1;
    string publicacao = 2;
    google.protobuf.Timestamp timestamp_pub = 3;
    int64 relogio = 4;
}

enum RequestTipo {
    LOGIN_USUARIO = 0;
    CRIAR_CANAL = 1;
    LISTAGEM_CANAIS = 2;
    PUBLICAR = 3;
}

message Request {
    RequestTipo tiporeq = 1;
    oneof requisicao {
        ReqLogin login_usuario = 2;
        ReqCriarCanal criar_canal = 3;
        ReqListarCanais listagem_canais = 4;
        ReqPublicar publicar = 5;
    }
    int64 relogio = 6;
}

message Reply {
    oneof resposta {
        RepLogin login_usuario = 1;
        RepCriarCanal criar_canal = 2;
        RepListarCanais listagem_canais = 3;
        RepPublicar publicar = 4;
    }
    int64 relogio = 5;
}

enum ReferenciaTipo {
    REGISTRAR = 0;
    HEARTBEAT = 1;
    LISTAGEM_SERVIDORES = 2;
}

message Ranking {
    string nome_servidor = 1;
    int32 rank = 2;
}

message ReqReferencia {
    ReferenciaTipo tipo_referencia = 1;
    string nome_servidor = 2;
    int64 relogio = 3;
}

message RepReferencia {
    bool sucesso = 1;
    string sucedido = 2;
    int32 rank = 3;
    repeated Ranking lista_servidores = 4;
    google.protobuf.Timestamp timestamp_ref = 5;
    int64 relogio = 6;
}

enum ServidorTipo {
    ELEICAO = 0;
    CONSULTAR_RELOGIO = 1;
    VERIFICAR_COORDENADOR = 2;
    AJUSTAR_RELOGIO = 3;
    SOLICITAR_REPLICAS = 4;
}

message ReqServidor {
    ServidorTipo tipo_servidor = 1;
    string nome_servidor = 2;
    int32 rank = 3;
    int64 relogio = 4;
    google.protobuf.Timestamp timestamp = 5;
    double ajuste = 6;
    int32 pagina = 7;
}

message RepServidor {
    bool sucesso = 1;
    string sucedido = 2;
    int64 relogio = 3;
    google.protobuf.Timestamp timestamp = 4;
    double ajuste = 5;
    bool mais = 6;
    repeated ReplicaPub publicacoes = 7;
    repeated ReplicaCanal canais = 8;
}

message AnuncioCoordenador {
    string nome_servidor = 1;
    int32 rank = 2;
    int64 relogio = 3;
}

message ReplicaPub {
    string id = 1;
    string topico = 2;
    string mensagem = 3;
    string timestamp_pub = 4;
    string servidor_origem = 5;
    int64 relogio_logico = 6;
}

message ReplicaCanal {
    string nome = 1;
    string timestamp_criacao = 2;
}

message Replicas {
    repeated ReplicaPub publicacoes = 1;
}